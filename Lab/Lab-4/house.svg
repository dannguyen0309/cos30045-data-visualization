<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
<title id="title">House and garden</title><desc id="desc">A yellow house with a teal roof, grouped windows, a curved garden path, a tree, sun and fence.</desc>
<rect width="720" height="440" fill="#e6f2f8"/><rect y="320" width="720" height="120" fill="#a8bd91"/>
<!-- circle: cx/cy locate the sun centre; r sets its radius. -->
<circle cx="615" cy="75" r="38" fill="#f1bd50"/>
<!-- ellipse: rx and ry are the horizontal and vertical radii. -->
<ellipse cx="120" cy="95" rx="70" ry="24" fill="white"/>
<rect x="434" y="92" width="28" height="80" fill="#8d5945" stroke="#344957" stroke-width="2"/>
<!-- rect: x/y locate the top-left corner; width/height set the wall size. -->
<rect x="220" y="180" width="280" height="180" fill="#f1dca8" stroke="#344957" stroke-width="2"/>
<!-- polygon: the listed vertices form a closed roof shape. -->
<polygon points="200,180 360,70 520,180" fill="#286b75" stroke="#344957" stroke-width="3"/>
<rect x="330" y="260" width="60" height="100" fill="#72533c"/><circle cx="377" cy="314" r="4" fill="#f1bd50"/>
<!-- g: children inherit fill and stroke; translate moves their local origin. -->
<g id="windows" fill="#bce4f3" stroke="#344957" stroke-width="3" transform="translate(250,210)">
<g><rect width="48" height="48"/><line x1="24" y1="0" x2="24" y2="48"/><line x1="0" y1="24" x2="48" y2="24"/></g>
<!-- Nested translate adds 172 to the outer group x position for the second window. -->
<g transform="translate(172,0)"><rect width="48" height="48"/><line x1="24" y1="0" x2="24" y2="48"/><line x1="0" y1="24" x2="48" y2="24"/></g></g>
<!-- path: M moves to the start; Q draws a quadratic curve through a control point. -->
<path d="M360 360 Q300 395 380 440" fill="none" stroke="#dfc8a5" stroke-width="32"/>
<rect x="95" y="245" width="20" height="110" fill="#72533c"/><ellipse cx="105" cy="235" rx="58" ry="70" fill="#3b7651"/>
<!-- polyline: connect the listed points without automatically closing the shape. -->
<polyline points="550,370 550,315 575,295 600,315 600,370 625,370 625,315 650,295 675,315 675,370" fill="none" stroke="#faf7ee" stroke-width="8"/>
<!-- line: x1/y1 and x2/y2 specify the two endpoints. -->
<line x1="540" y1="345" x2="690" y2="345" stroke="#faf7ee" stroke-width="8"/>
<!-- text: x/y locate the text baseline, rather than its top-left corner. -->
<text x="24" y="40" font-family="sans-serif" font-size="22" fill="#163247">A quiet garden</text>
</svg>
